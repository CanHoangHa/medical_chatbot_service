services:
  # ==========================================
  # POSTGRESQL (Lưu trữ chính)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: medical-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: medical_chatbot_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d medical_chatbot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medical-network

  # ==========================================
  # REDIS (Cache & Rate Limiting)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: medical-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medical-network

  # ==========================================
  # KAFKA (KRaft mode - Không cần Zookeeper)
  # ==========================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: medical-kafka
    user: "root"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kafka-logs
    networks:
      - medical-network

networks:
  medical-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data: